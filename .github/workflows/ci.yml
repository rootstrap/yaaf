name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-ci]')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gemfile: [rails_7_1.gemfile, rails_7_2.gemfile, rails_8_0.gemfile, rails_8_1.gemfile, rails_main.gemfile]
        ruby_version: ['2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']
        exclude:
          - gemfile: rails_main.gemfile
            ruby_version: '2.7'
          - gemfile: rails_main.gemfile
            ruby_version: '3.0'
          - gemfile: rails_main.gemfile
            ruby_version: '3.1'
          - gemfile: rails_8_1.gemfile
            ruby_version: '2.7'
          - gemfile: rails_8_1.gemfile
            ruby_version: '3.0'
          - gemfile: rails_8_1.gemfile
            ruby_version: '3.1'
          - gemfile: rails_8_0.gemfile
            ruby_version: '2.7'
          - gemfile: rails_8_0.gemfile
            ruby_version: '3.0'
          - gemfile: rails_8_0.gemfile
            ruby_version: '3.1'
          - gemfile: rails_7_2.gemfile
            ruby_version: '2.7'
          - gemfile: rails_7_2.gemfile
            ruby_version: '3.0'
    env:
      BUNDLE_GEMFILE: spec/gemfiles/${{ matrix.gemfile }}
    steps:
    - uses: actions/checkout@v2
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby_version }}
    - name: Run test
      run: |
        bundle update
        bundle install --gemfile spec/gemfiles/${{ matrix.gemfile }} --jobs 4 --retry 3
        bundle exec rake code_analysis
        bundle exec rspec
